---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: andrew
  namespace: andrew

---
apiVersion: v1
kind: Secret
metadata:
  name: andrew-serviceaccount-secret
  namespace: andrew
  annotations:
    kubernetes.io/service-account.name: andrew
type: kubernetes.io/service-account-token

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: andrew-cluster-admin
  namespace: andrew
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: andrew
    namespace: andrew

---
apiVersion: v1
data:
  token: $(oc get secret andrew-serviceaccount-secret -o json | jq -r '.data.token' | base64 -d)
kind: Secret
metadata:
  name: token
  namespace: andrew
type: Opaque
